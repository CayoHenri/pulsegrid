name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      FORCE_COLOR: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Lint
        run: npm run lint
        timeout-minutes: 2

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 2

      - name: Tests with coverage
        run: npm run test:coverage -- --reporter=verbose --pool=forks --maxWorkers=2
        timeout-minutes: 3

      - name: Build
        run: npm run build
        timeout-minutes: 2

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: pulsegrid-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  security-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts
        timeout-minutes: 3

      - name: Audit production dependencies
        run: npm run security:audit -- --loglevel verbose
        timeout-minutes: 2
